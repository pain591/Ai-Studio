<title>Shanghai Plot Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: light planning workbench. Nav + district rail | rounded 3D map card | numbered plot-details panel.
   Single light look by design (matches the reference board); every colour is set explicitly. */
:root {
  color-scheme: light;
  --page: #f3f5f8;
  --panel: #ffffff;
  --soft: #f5f7fa;
  --line: #e6e9ef;
  --ink: #1b2433;
  --ink-2: #4a5568;
  --muted: #8a94a6;
  --blue: #2f6bff;
  --blue-ink: #ffffff;
  --blue-soft: #eaf1ff;
  --navy: #142449;
  --ok: #1f9d5a;
  --ok-soft: #e8f7ee;
  --warn: #d98a09;
  --warn-soft: #fff5e1;
  --stop: #e5484d;
  --stop-soft: #fdeced;
  --shadow: 0 1px 2px rgb(20 36 73 / .06), 0 4px 16px rgb(20 36 73 / .07);
  --r: 12px;
  --font: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.zh { font-family: var(--font-zh); }
.en { color: var(--muted); font-size: 11.5px; }
.num { font-variant-numeric: tabular-nums; }
.bi { display: inline-flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.bi .zh { font-weight: 600; color: var(--ink); }
body.lang-en .bi .zh, body.lang-en .zh-only { display: none; }
body.lang-en .bi .en { font-size: inherit; color: inherit; font-weight: 600; }
body.lang-en .bi.light .en { font-weight: 400; }

.app { height: 100%; display: grid; grid-template-rows: 60px minmax(0, 1fr); }

/* top bar */
.top { display: flex; align-items: center; gap: 20px; padding-inline: 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 200px; }
.brand b { display: block; font-family: var(--font-zh); font-size: 16px; font-weight: 700; letter-spacing: .02em; }
.brand span { display: block; font-size: 12.5px; color: var(--ink-2); }
.search { flex: 1 1 auto; max-width: 520px; position: relative; }
.search input { width: 100%; box-sizing: border-box; height: 38px; padding: 0 14px 0 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-2); }
.top .spacer { flex: 1; }
.seg { display: inline-flex; background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 20px; border-radius: 999px; color: var(--ink-2); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.iconbtn { width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; color: var(--ink-2); }
.iconbtn:hover { background: var(--soft); color: var(--ink); }
.lang { border: 0; background: none; font-weight: 600; color: var(--ink-2); padding: 6px 8px; border-radius: 8px; }
.lang b { color: var(--ink); }
.lang:hover { background: var(--soft); }

.work { display: grid; grid-template-columns: 236px minmax(0, 1fr) 396px; min-height: 0; }

/* left rail */
.rail { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 12px 10px 12px 12px; min-height: 0; }
.nav { display: grid; gap: 2px; background: var(--panel); border-radius: var(--r); padding: 8px; box-shadow: var(--shadow); }
.nav button { display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 9px 12px; border-radius: 8px; color: var(--ink-2); text-align: left; }
.nav button:hover { background: var(--soft); }
.nav button[aria-selected="true"] { background: var(--blue-soft); color: var(--blue); }
.nav button[aria-selected="true"] .bi .zh { color: var(--blue); }
.nav button[aria-selected="true"] .bi .en { color: var(--blue); }
.railbody { background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); overflow-y: auto; min-height: 0; }
.rsec { padding: 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.rsec:last-child { border-bottom: 0; }
.rhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rhead .bi .zh { font-size: 13.5px; }
.minimap { background: var(--soft); border-radius: 10px; padding: 8px; position: relative; }
.minimap svg { display: block; width: 100%; height: auto; cursor: pointer; }
.minimap .sh { position: absolute; left: 12px; top: 8px; line-height: 1.2; }
.legend { display: grid; gap: 7px; }
.legend .row { display: grid; grid-template-columns: 16px auto minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.legend .row .en { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
.legend .row .zh { white-space: nowrap; }
.legend i { width: 16px; height: 16px; border-radius: 4px; }
.legend .code { color: var(--muted); font-size: 11px; }
.legend .row .zh { font-weight: 500; }
.legend .metro i { height: 3px; border-radius: 2px; background: #e4002b; }
.switchrow { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; }
.switchrow.child { padding-left: 18px; grid-template-columns: 10px 1fr auto; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.sw { position: relative; width: 32px; height: 18px; flex: none; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sw span { position: absolute; inset: 0; border-radius: 999px; background: #cfd6e2; transition: background .15s; pointer-events: none; }
.sw span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: transform .15s; }
.sw input:checked + span { background: var(--blue); }
.sw input:checked + span::after { transform: translateX(14px); }
.sw input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
.zonecard { display: grid; grid-template-columns: 10px 1fr; gap: 10px; align-items: start; }
.zonecard .dot { margin-top: 5px; }
.zonecard p { margin: 2px 0 0; color: var(--ink-2); font-size: 12px; }
.doc { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; }
.doc a { color: var(--ink); text-decoration: none; font-weight: 500; }
.doc a:hover { color: var(--blue); }
.tag { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.plan { background: var(--soft); color: var(--muted); }
.tag.cite { background: var(--blue-soft); color: var(--blue); }
.note { margin: 0; color: var(--muted); font-size: 11.5px; }

/* map card */
.mapcard { position: relative; margin: 12px 0; border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); background: #eceee9; min-height: 0; }
#map { position: absolute; inset: 0; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.crumb { position: absolute; left: 14px; top: 14px; display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 8px; padding: 6px 12px; box-shadow: var(--shadow); font-family: var(--font-zh); }
.crumb button { border: 0; background: none; padding: 0; font-weight: 500; color: var(--ink-2); }
.crumb button.here { color: var(--ink); font-weight: 600; }
.crumb button:hover { color: var(--blue); }
.crumb .sep { color: var(--muted); }
.ctl { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: grid; gap: 10px; }
.ctl .grp { background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); display: grid; overflow: hidden; }
.ctl .grp button { width: 36px; height: 36px; border: 0; background: none; display: grid; place-items: center; color: var(--ink-2); }
.ctl .grp button + button { border-top: 1px solid var(--line); }
.ctl .grp button:hover { color: var(--blue); background: var(--soft); }
.locator { position: absolute; right: 14px; bottom: 14px; width: 118px; background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; }
.locator svg { width: 100%; height: auto; display: block; cursor: pointer; }
.attrib { position: absolute; left: 10px; bottom: 6px; font-size: 10px; color: var(--ink-2); background: rgb(255 255 255 / .75); padding: 1px 6px; border-radius: 4px; }

/* map labels */
.lbl { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.lbl .card { background: rgb(255 255 255 / .94); border-radius: 6px; padding: 3px 8px 3px 7px; box-shadow: 0 1px 4px rgb(20 36 73 / .18); line-height: 1.15; }
.lbl .card b { display: block; font-family: var(--font-zh); font-size: 12px; font-weight: 700; color: var(--ink); }
.lbl .card span { display: block; font-size: 9.5px; color: var(--ink-2); }
body.lang-en .lbl .card b { display: none; }
body.lang-en .lbl .card span { font-size: 11px; font-weight: 600; color: var(--ink); }
.lbl .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; box-shadow: 0 0 0 2px #fff, 0 1px 4px rgb(0 0 0 / .25); flex: none; }
.lbl.metro .ic { background: #e4002b; }
.lbl.mark .ic { background: #1f9d5a; }
.lbl.area .ic { background: #6b7a90; }
.lbl.district .card { background: rgb(255 255 255 / .85); }
.lbl.river { transform: translate(-50%, -50%); text-align: center; color: #3b7fb5; text-shadow: 0 0 3px rgb(255 255 255 / .9); line-height: 1.2; }
.lbl.river b { display: block; font-family: var(--font-zh); font-size: 14px; letter-spacing: .1em; font-weight: 500; }
.lbl.river span { font-size: 10.5px; }
body.lang-en .lbl.river b { display: none; }
.pop { position: absolute; transform: translate(-50%, calc(-100% - 14px)); background: var(--panel); border-radius: 10px; box-shadow: 0 6px 24px rgb(20 36 73 / .22); padding: 10px 12px; display: grid; gap: 4px; min-width: 180px; pointer-events: auto; }
.pop::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: var(--panel); transform: translateX(-50%) rotate(45deg); }
.pop .r1 { display: flex; align-items: center; gap: 10px; }
.pop .id { color: var(--blue); font-weight: 600; }
.pop .code { background: var(--navy); color: #fff; border-radius: 5px; padding: 0 7px; font-size: 11px; font-weight: 600; }
.pop .r2 { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-2); font-size: 12px; }
.pop .r2 b { color: var(--ink); }
.hint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 12px; box-shadow: var(--shadow); }
.sheet { display: none; }

/* details panel */
.details { margin: 12px 12px 12px 10px; background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); overflow-y: auto; min-height: 0; }
.dhead { position: sticky; top: 0; z-index: 2; background: var(--panel); display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.dhead .bi .zh { font-size: 16px; }
.dhead .bi .en { font-size: 12.5px; }
.dhead .x { margin-left: auto; }
.proto { margin: 12px 16px 0; padding: 7px 10px; border-radius: 8px; background: var(--warn-soft); color: #8a5a00; font-size: 11.5px; }
.dsec { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.dsec:last-child { border-bottom: 0; }
.dsh { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dsh .bi .zh { font-size: 14px; }
.dsh .bi .en { font-size: 12px; }
.link { border: 0; background: none; padding: 0; color: var(--blue); font-size: 12px; white-space: nowrap; text-decoration: none; }
.link:hover { text-decoration: underline; }
.kv { display: grid; grid-template-columns: 1fr 1.25fr; gap: 9px 12px; align-items: start; }
.kv .k .zh { font-weight: 600; }
.kv .v { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
.kv .v .sw2 { width: 22px; height: 22px; border-radius: 5px; flex: none; }
.kv .v b { font-weight: 600; }
.ztags { display: flex; flex-wrap: wrap; gap: 4px; }
.ztag { font-size: 11px; padding: 1px 7px; border-radius: 999px; font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; display: grid; gap: 6px; min-width: 0; }
.tile .lab { display: flex; gap: 5px; flex-wrap: wrap; align-items: baseline; font-size: 11.5px; }
.tile .lab .zh { font-weight: 600; color: var(--ink-2); }
.tile .lab .en { font-size: 9.5px; }
.tile strong { font-size: 15.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile.bind { border-color: #f2c26b; background: var(--warn-soft); }
.tile .small { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.env { display: grid; grid-template-columns: 132px 1fr; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: linear-gradient(180deg, #fbfcff, #f4f7fd); }
.env svg { width: 100%; height: auto; }
.env .bi .zh { font-size: 13px; }
.env .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 4px 0 0; }
.env .calc { color: var(--muted); font-size: 11px; margin: 0 0 10px; }
.btn { border: 0; background: var(--blue); color: var(--blue-ink); border-radius: 8px; padding: 8px 14px; font-weight: 600; display: inline-grid; justify-items: center; line-height: 1.2; }
.btn small { font-weight: 400; font-size: 10.5px; opacity: .9; }
body.lang-en .btn .zh-only { display: none; }
.btn:hover { filter: brightness(1.06); }
.fitline { font-size: 12px; color: var(--ink-2); }
.bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); }
.rules { display: grid; }
.rule { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); }
.rule:first-child { border-top: 0; padding-top: 0; }
.rule .dot { margin-top: 5px; }
.rule .t { border: 0; background: none; padding: 0; text-align: left; display: grid; gap: 1px; }
.rule .t .zh { font-weight: 600; }
.rule p { margin: 6px 0 0; color: var(--ink-2); font-size: 12px; }
.files { display: grid; gap: 10px; }
.file { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: start; }
.file svg { color: var(--ink-2); margin-top: 2px; }
.ask { display: grid; gap: 8px; }
.ask form { display: flex; gap: 6px; }
.ask input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.chips button:hover { border-color: var(--blue); color: var(--blue); }
.verdict { border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.verdict.ok { background: var(--ok-soft); border: 1px solid #bfe6cf; }
.verdict.warn { background: var(--warn-soft); border: 1px solid #f3d9a4; }
.verdict.stop { background: var(--stop-soft); border: 1px solid #f6c3c5; }
.verdict .vh { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.verdict.ok .vh { color: var(--ok); } .verdict.warn .vh { color: var(--warn); } .verdict.stop .vh { color: var(--stop); }
.verdict .vh .en { color: inherit; font-size: 12.5px; font-weight: 600; }
.verdict .s1 { font-family: var(--font-zh); color: var(--ink); }
.verdict .s2 { color: var(--ink-2); font-size: 12px; }
.verdict ul { margin: 2px 0 0; padding-left: 16px; display: grid; gap: 2px; color: var(--ink-2); font-size: 12px; }
.verdict .fine { color: var(--muted); font-size: 10.5px; }
.empty { padding: 40px 24px; text-align: center; color: var(--ink-2); display: grid; gap: 6px; }

@media (max-width: 1240px) { .work { grid-template-columns: 210px minmax(0, 1fr) 360px; } .brand span { display: none; } }
@media (max-width: 960px) {
  .app { height: auto; grid-template-rows: auto auto; }
  .top { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
  .brand { min-width: 0; }
  .search { order: 5; flex-basis: 100%; max-width: none; }
  .top .spacer { display: none; }
  .work { grid-template-columns: minmax(0, 1fr); grid-template-areas: "map" "details" "rail"; }
  .mapcard { grid-area: map; height: 64vh; min-height: 380px; margin: 10px 12px 0; }
  .details { grid-area: details; margin: 12px; overflow: visible; }
  .dhead { position: static; }
  .rail { grid-area: rail; padding: 0 12px 16px; }
  .nav { grid-auto-flow: column; overflow-x: auto; }
  .railbody { overflow: visible; }
  .ctl { top: 60px; transform: none; }
  .locator, .pop, .hint { display: none; }
  .sheet { display: flex; position: absolute; left: 10px; right: 10px; bottom: 10px; background: var(--panel); border-radius: 12px; box-shadow: 0 6px 24px rgb(20 36 73 / .2); padding: 10px 12px; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .sheet .id { color: var(--blue); font-weight: 600; }
  .attrib { bottom: 84px; left: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="15" width="5" height="16" rx="1.5" fill="#2f6bff"/><rect x="10.5" y="7" width="5" height="24" rx="1.5" fill="#142449"/><rect x="18" y="11" width="5" height="20" rx="1.5" fill="#2f6bff"/><rect x="25.5" y="3" width="5" height="28" rx="1.5" fill="#142449"/></svg>
      <div><b>上海地块图谱</b><span>Shanghai Plot Atlas</span></div>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" list="names" placeholder="搜索地址、地块、区域…   Search address, plot, or area…" autocomplete="off" aria-label="Search address, plot, or area">
      <datalist id="names"></datalist>
    </div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="View mode">
      <button type="button" id="v3d" aria-pressed="true">3D</button>
      <button type="button" id="v2d" aria-pressed="false">2D</button>
    </div>
    <button type="button" class="iconbtn" id="locate" aria-label="Go to selected plot" title="Go to selected plot">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2.3" fill="currentColor"/><path d="M10 1.5v2.5M10 16v2.5M1.5 10H4M16 10h2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="lang" id="lang" aria-label="Switch language"><b id="lang-zh">中</b> / <span id="lang-en">EN</span></button>
  </header>

  <div class="work">
    <aside class="rail">
      <nav class="nav" role="tablist" aria-label="Sidebar">
        <button type="button" role="tab" data-tab="map" aria-selected="true">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M1.5 4l5-2 5 2 5-2v12l-5 2-5-2-5 2z M6.5 2v12 M11.5 4v12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span class="bi light"><span class="zh">地图</span><span class="en">Map</span></span></button>
        <button type="button" role="tab" data-tab="layers" aria-selected="false">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2l7 3.5-7 3.5-7-3.5z M2 9l7 3.5L16 9 M2 12.5L9 16l7-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span class="bi light"><span class="zh">图层</span><span class="en">Layers</span></span></button>
        <button type="button" role="tab" data-tab="rules" aria-selected="false">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 1.8h7l3.2 3.2v11.2H4z M10.8 1.8V5h3.4 M6.5 8.5h5 M6.5 11h5 M6.5 13.5h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span class="bi light"><span class="zh">规则</span><span class="en">Rules</span></span></button>

function evaluate(p) {

  if (p.c === 'S' || p.c === 'D') rules.push({ s: 'stop', zh: '不可用于经营性开发', en: 'Not open for private development', d: 'Transport and special-use land needs a plan change before any building.', src: 'zdbf' });
  if (p.c === 'G') rules.push({ s: 'stop', zh: '公共绿地保护', en: 'Protected public green space', d: 'Only small park buildings are allowed. Changing green space needs a plan revision with public notice.', src: 'kgzz' });

  if (z.has('westbund') && far > 0.5) { h = Math.max(h, 120); rules.push({ s: 'info', zh: '徐汇滨江 · 西岸 特别管控区', en: 'West Bund special control zone', d: 'Keep the riverside walk public. Tower heights follow the West Bund urban design guide.', src: 'gxtl' }); }

function ringArea(r) {
  const kx = Math.cos(31.18 * Math.PI / 180) * 111320, ky = 110540; let a = 0;
  for (let i = 0; i < r.length; i++) { const [x1, y1] = r[i], [x2, y2] = r[(i + 1) % r.length]; a += (x1 * kx) * (y2 * ky) - (x2 * kx) * (y1 * ky); }
  return Math.abs(a / 2);
}
function scaleRing(r, s) {
  const cx = r.reduce((a, p) => a + p[0], 0) / r.length, cy = r.reduce((a, p) => a + p[1], 0) / r.length;
  return r.map(([x, y]) => [cx + (x - cx) * s, cy + (y - cy) * s]);
}
// Test design: a 2-floor podium over the allowed coverage + a tower holding the rest, capped by the height limit.
function massing(ev, env) {
  const fl = ev.c.floor, envA = Math.max(1, ringArea(env));
  const podA = Math.min(ev.footprint, envA), podFloors = Math.min(2, Math.max(1, Math.floor(ev.h / fl)));
  const podH = podFloors * fl, rest = Math.max(0, ev.gfa - podA * podFloors);
  const tmax = Math.max(0, Math.floor((ev.h - podH) / fl));
  let towA = tmax ? Math.max(envA * 0.06, rest / tmax) : 0; towA = Math.min(towA, podA);
  const towFloors = towA ? Math.min(tmax, Math.ceil(rest / towA)) : 0;
  const parts = [{ ring: scaleRing(env, Math.sqrt(podA / envA)), top: podH }];
  if (towFloors) parts.push({ ring: scaleRing(env, Math.sqrt(towA / envA) * 0.9), top: podH + towFloors * fl });
  return { parts, top: podH + towFloors * fl, built: podA * podFloors + towA * towFloors, podFloors, towFloors };
}

function verdictHtml(a) {
  const head = { ok: ['可建设', 'Buildable', ICON.check], warn: ['需调整', 'Needs changes', ICON.warn], stop: ['不可建设', 'Not buildable', ICON.warn] }[a.v];
  return `<div class="verdict ${a.v}" aria-live="polite"><div class="vh">${head[2]}${bi(head[0], head[1])}</div><div class="s1 zh-only">${a.lines[0]}</div><div class="s2">${a.lines[1]}</div>
    <ul>${a.pts.map(x => `<li>${x}</li>`).join('')}</ul><div class="fine">Guidance from a prototype rules engine, not an official planning decision.</div></div>`;
}
function sheet() {
  const p = state.sel, el = $('sheet');
  if (!p) { el.hidden = true; return; }
  el.hidden = false;
  const c = CAT[p.c];
  el.innerHTML = `<div><span class="id">${p.code}</span> <span class="tag cite">${c.code} · ${state.lang === 'en' ? c.en : c.zh}</span><div class="num">${fmt(p.a)} m²</div></div><button type="button" class="btn" id="sheet-go"><span class="zh-only">查看详情</span><small>View details</small></button>`;
  $('sheet-go').onclick = () => $('details').scrollIntoView({ behavior: 'smooth' });
}

// ---------- left rail ----------
function miniSvg(svg, opts = {}) {
  const all = districts.flatMap(d => d.rings.flat());
  const minx = Math.min(...all.map(p => p[0])), maxx = Math.max(...all.map(p => p[0])), miny = Math.min(...all.map(p => p[1])), maxy = Math.max(...all.map(p => p[1]));
  const k = Math.cos(31.2 * Math.PI / 180), W = 200, H = W * (maxy - miny) / ((maxx - minx) * k);
  const pt = ([x, y]) => [((x - minx) / (maxx - minx) * W), ((maxy - y) / (maxy - miny) * H)];
  svg.setAttribute('viewBox', `0 0 ${W} ${H.toFixed(1)}`);
  const xc = pt(xuhuiCenter);
  svg.innerHTML = districts.map(d => d.rings.map(r => `<path d="M${r.map(q => pt(q).map(n => n.toFixed(1)).join(',')).join('L')}Z" fill="${d.code === 310104 ? '#2f6bff' : '#d9dfe8'}" stroke="#fff" stroke-width=".8"><title>${d.name}</title></path>`).join('')).join('')
    + (opts.pin ? `<g transform="translate(${xc[0].toFixed(1)},${(xc[1] - 2).toFixed(1)})"><path d="M0 0s-7-6.3-7-11.3a7 7 0 0 1 14 0C7-6.3 0 0 0 0z" fill="#2f6bff" stroke="#fff" stroke-width="1.5"/><circle cx="0" cy="-11" r="2.6" fill="#fff"/></g>` : `<circle id="loc-dot" cx="${xc[0].toFixed(1)}" cy="${xc[1].toFixed(1)}" r="3.5" fill="#2f6bff" stroke="#fff" stroke-width="1.5"/>`);
}
const xuhuiCenter = [121.437, 31.172];

function setTab(t) { state.tab = t; document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t)); rail(); }
function rail() {
  const el = $('railbody');
  const lg = Object.entries(CAT).filter(([k]) => k !== 'D' && k !== 'CR').map(([k, c]) => `<div class="row"><i style="background:${c.color}"></i><span class="zh zh-only">${c.zh}</span><span class="en">${c.en}</span><span class="code">${c.code}</span></div>`).join('')
    + `<div class="row"><i style="background:#b5d8ee"></i><span class="zh zh-only">道路/水域</span><span class="en">Road/Water</span><span class="code">—</span></div><div class="row metro"><i></i><span class="zh zh-only">地铁</span><span class="en">Metro</span><span class="code"></span></div>`;
  const sw = (id, on, label, dot = '', child = false) => `<label class="switchrow ${child ? 'child' : ''}">${dot ? `<span class="dot" style="background:${dot}"></span>` : '<span></span>'}${label}<span class="sw"><input type="checkbox" data-l="${id}" ${on ? 'checked' : ''}><span></span></span></label>`;
  if (state.tab === 'map') el.innerHTML = `
    <div class="rsec"><div class="rhead">${bi('徐汇区', 'Xuhui District')}<button type="button" class="iconbtn" id="r-sh" aria-label="Show all of Shanghai" title="Show all of Shanghai">${ICON.close}</button></div>
      <div class="minimap"><div class="sh">${bi('上海', 'Shanghai', 'light')}</div><svg id="mini" role="button" tabindex="0" aria-label="Fly to Xuhui"></svg></div>
      <p class="note">${fmt(plots.length)} plots · ${fmt(buildings.length)} buildings · ${stations.length} metro stations</p></div>
    <div class="rsec">${bi('图例', 'Legend')}<div class="legend">${lg}</div></div>`;
  if (state.tab === 'layers') el.innerHTML = `<div class="rsec">${bi('图层控制', 'Layer Controls')}
      ${sw('plots', state.layers.plots, bi('地块', 'Land-use plots', 'light'))}
      ${sw('bldg', state.layers.bldg, bi('建筑', 'Buildings', 'light'))}
      ${sw('metro', state.layers.metro, bi('地铁', 'Metro', 'light'))}
      ${sw('zones', state.layers.zones, bi('规划叠加', 'Regulation overlays', 'light'))}
      ${zones.map(z => sw('z:' + z.id, state.zones[z.id], bi(ZONE[z.id].short[0], ZONE[z.id].en, 'light'), ZONE[z.id].color, true)).join('')}
      <p class="note">Building heights: ${fmt(D.stats.tagged_heights)} from OpenStreetMap tags, the rest estimated.</p></div>`;
  if (state.tab === 'rules') el.innerHTML = `
    <div class="rsec">${bi('规划叠加', 'Regulation overlays')}${zones.map(z => `<div class="zonecard"><span class="dot" style="background:${ZONE[z.id].color}"></span><div>${bi(ZONE[z.id].zh, '', '')}<div class="en">${ZONE[z.id].en}</div><p>${state.lang === 'en' ? ZONE[z.id].what[1] : ZONE[z.id].what[0] + ' · ' + ZONE[z.id].what[1]}</p></div></div>`).join('')}
      <p class="note">Outlines are approximate in this prototype.</p></div>
    <div class="rsec">${bi('法规与标准', 'Regulations')}${Object.values(SRC).map(s => `<div class="doc">${ICON.file}<div><a href="${s.u}" target="_blank" rel="noopener"><span class="zh-only">${s.zh}</span></a><div class="en">${s.en}</div><span class="tag cite">Cited</span></div></div>`).join('')}</div>`;
  if (state.tab === 'more') el.innerHTML = `
    <div class="rsec">${bi('数据来源', 'Map data')}
      ${[['OpenStreetMap 建筑', `${fmt(D.stats.buildings)} building footprints`], ['OpenStreetMap 用地', `${fmt(plots.length)} plots mapped to planning categories`], ['OpenStreetMap 道路与地铁', `${fmt(D.stats.roads)} road segments, ${stations.length} stations`], ['DataV GeoAtlas', '16 district outlines']].map(([a, b]) => `<div class="doc">${ICON.file}<div><span class="zh">${a}</span><div class="en">${b}</div><span class="tag ok">Loaded</span></div></div>`).join('')}</div>
    <div class="rsec">${bi('待接入', 'Planned pipelines')}
      ${[['区控规公示', 'District plan notices: real limits per plot'], ['土地出让方案', 'Land sale notices: exact plot conditions'], ['风貌区与优秀历史建筑名录', 'Official heritage boundaries and listed buildings'], ['机场净空限高', 'Airport height-control surfaces'], ['一网通办 经营许可', 'Business licensing rules by address']].map(([a, b]) => `<div class="doc">${ICON.file}<div><span class="zh">${a}</span><div class="en">${b}</div><span class="tag plan">Planned</span></div></div>`).join('')}</div>
    <div class="rsec"><p class="note">Prototype for design review. Planning values and zone outlines are illustrative, not official 控规 data. Map data © OpenStreetMap contributors (ODbL).</p></div>`;
  el.querySelectorAll('[data-l]').forEach(i => i.onchange = () => { const k = i.dataset.l; if (k.startsWith('z:')) state.zones[k.slice(2)] = i.checked; else state.layers[k] = i.checked; draw(); placeLabels(); });
  const mini = $('mini'); if (mini) { miniSvg(mini, { pin: true }); mini.onclick = () => fly(XH_VIEW); mini.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fly(XH_VIEW); } }; }
  const rsh = $('r-sh'); if (rsh) rsh.onclick = () => fly(SH_VIEW);
}

function draw() { if (deckgl) deckgl.setProps({ layers: layers() }); }
function render() { details(); pop.innerHTML = popHtml(); draw(); placeLabels(); }
function setLang(l) { state.lang = l; document.body.classList.toggle('lang-en', l === 'en'); $('lang-zh').outerHTML = l === 'zh' ? '<b id="lang-zh">中</b>' : '<span id="lang-zh">中</span>'; $('lang-en').outerHTML = l === 'en' ? '<b id="lang-en">EN</b>' : '<span id="lang-en">EN</span>'; rail(); render(); }

// ---------- wiring ----------
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
const setPitch = p => { state.pitch = p; $('v3d').setAttribute('aria-pressed', p > 0); $('v2d').setAttribute('aria-pressed', p === 0); fly({ pitch: p, bearing: p ? -20 : 0 }, 800); draw(); };
$('v3d').onclick = () => setPitch(55); $('v2d').onclick = () => setPitch(0);
$('locate').onclick = () => state.sel ? flyToPlot(state.sel) : fly(XH_VIEW);
$('lang').onclick = () => setLang(state.lang === 'zh' ? 'en' : 'zh');
$('crumb-sh').onclick = () => fly(SH_VIEW); $('crumb-xh').onclick = () => fly(XH_VIEW);
$('north').onclick = () => fly({ bearing: 0 }, 600);
$('zin').onclick = () => fly({ zoom: viewState.zoom + 1 }, 400); $('zout').onclick = () => fly({ zoom: viewState.zoom - 1 }, 400);
$('home').onclick = () => fly(XH_VIEW);
$('locator').onclick = () => fly(SH_VIEW);
$('locator').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fly(SH_VIEW); } };
$('q').addEventListener('change', () => {
  const v = $('q').value.trim(); if (!v) return;
  const p = plots.find(p => p.n === v || p.code === v.toUpperCase()) || plots.find(p => p.n && p.n.includes(v));
  if (p) return select(p);
  const s = stations.find(s => s.n.includes(v) || s.en.toLowerCase().includes(v.toLowerCase())) || landmarks.find(l => l.zh.includes(v) || l.en.toLowerCase().includes(v.toLowerCase()));
  if (s) fly({ longitude: s.pos[0], latitude: s.pos[1], zoom: 16, pitch: state.pitch });
});

function start() {
  $('names').innerHTML = [...new Set([...plots.filter(p => p.n).map(p => p.n), ...stations.map(s => s.n), ...landmarks.map(l => l.zh)])].map(n => `<option value="${esc(n)}">`).join('');
  miniSvg($('locator'));
  rail();
  state.sel = defaultPlot;
  const c = defaultPlot.center;
  viewState = { longitude: c[0] + 0.0006, latitude: c[1] - 0.0042, zoom: 15.05, pitch: 55, bearing: -20 };
  deckgl = new deck.DeckGL({
    container: 'map', initialViewState: viewState, controller: true,
    onViewStateChange: ({ viewState: v }) => { viewState = v; $('crumb-sh').classList.toggle('here', v.zoom < 11); $('crumb-xh').classList.toggle('here', v.zoom >= 11); },
    onAfterRender: placeLabels, layers: [], getTooltip: tooltip, onClick,
    effects: [new deck.LightingEffect({
      ambient: new deck.AmbientLight({ color: [255, 255, 255], intensity: 1.05 }),
      sun: new deck.DirectionalLight({ color: [255, 250, 240], intensity: 1.5, direction: [-3, -5, -6] }),
    })],
    getCursor: ({ isHovering }) => isHovering ? 'pointer' : 'grab',
  });
  render();
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
})();
</script>
